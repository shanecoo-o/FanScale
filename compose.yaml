name: fanscale-local

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FANSCALE_DB_NAME:-fanscale}
      POSTGRES_USER: ${FANSCALE_DB_USERNAME:-fanscale}
      POSTGRES_PASSWORD: ${FANSCALE_DB_PASSWORD:-fanscale_local_only}
    ports:
      - "${FANSCALE_DB_PORT:-5432}:5432"
    volumes:
      - fanscale_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  fanscale_postgres_data:
