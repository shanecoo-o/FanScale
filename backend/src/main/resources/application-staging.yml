spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: jdbc:postgresql://${FANSCALE_DB_HOST}:${FANSCALE_DB_PORT:5432}/${FANSCALE_DB_NAME:fanscale}
    username: ${FANSCALE_DB_USERNAME}
    password: ${FANSCALE_DB_PASSWORD}

springdoc:
  api-docs:
    enabled: ${FANSCALE_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${FANSCALE_OPENAPI_ENABLED:false}

fanscale:
  environment: staging
  cors:
    allowed-origins: ${FANSCALE_CORS_ALLOWED_ORIGINS}
