spring:
  application:
    name: fanscale-backend
  datasource:
    url: jdbc:postgresql://${FANSCALE_DB_HOST:localhost}:${FANSCALE_DB_PORT:5432}/${FANSCALE_DB_NAME:fanscale}
    username: ${FANSCALE_DB_USERNAME:fanscale}
    password: ${FANSCALE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: fanscale
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: fanscale
    default-schema: fanscale
    validate-migration-naming: true
    validate-on-migrate: true

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: FanScale Backend
    api-version: v1

springdoc:
  api-docs:
    enabled: ${FANSCALE_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${FANSCALE_OPENAPI_ENABLED:false}

fanscale:
  environment: ${FANSCALE_ENVIRONMENT:unspecified}
  cors:
    allowed-origins: ${FANSCALE_CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"
